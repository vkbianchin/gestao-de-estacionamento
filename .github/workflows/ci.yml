name: CI
on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compila todos os arquivos Python
        run: python -m compileall -q app scripts tests run.py
      - name: Verifica a sintaxe do JavaScript
        run: find static/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Testes automatizados (sem banco)
        run: python -m pytest -q

  banco-real:
    # Executa o SQL de verdade: carrega banco/schema.sql num MariaDB 10.11 e roda os fluxos principais.
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: raiz-de-teste
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      PARKFLOW_TESTE_BANCO: "1"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: parkflow_teste
      DB_USER: root
      DB_PASSWORD: raiz-de-teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes de integração com MariaDB
        run: python -m pytest tests/integracao -v
